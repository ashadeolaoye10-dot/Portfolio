<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Native Exhibit | Login</title>

    <link rel="stylesheet"
          href="Plogin.css">

</head>

<body>

    <!-- =====================
            LOGIN SECTION
    ====================== -->

    <section class="login-section">

        <div class="login-container">

            <div class="login-header">

                <h1>

                    Native <span>Exhibit</span>

                </h1>

                <p>

                    Login to continue exploring
                    Nigeria's cultural heritage

                </p>

            </div>

                        <form id="loginForm">

                <div class="input-box">

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter Email"
                        required
                    >

                </div>

                <div class="input-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter Password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>

            </form>

        </div>

    </section>


    <script src="Plogin.js"></script>

</body>

</html>
